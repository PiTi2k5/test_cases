<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf8" />
		<title>audio instead of video and video instead of audio</title>
		<script src="demo.js"></script>
	</head>
	<body>
		<h1>audio instead of video and video instead of audio</h1>
		<p>
			This is an <kbd>audio</kbd> element where the source is a video file:
			<audio src="../../assets/rhythmchirp.mp4" controls></audio>
		</p>
		<p>
			This is a <kbd>video</kbd> element where the source is an audio file:
			<video src="../../assets/rhythmchirp.mp3" controls></video>
		</p>
	</body>
</html>
